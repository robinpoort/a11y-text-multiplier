<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spill</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 class="sp-sr" data-i18n="appShortName">Spill</h1>

    <div class="sp-tabs" role="tablist" data-i18n-label="uiViewLabel">
      <button class="sp-tab" id="tab-multiply" role="tab" type="button" aria-selected="true" aria-controls="panel-multiply">
        <span data-i18n="uiTabMultiply">Multiply</span>
      </button>
      <button class="sp-tab" id="tab-settings" role="tab" type="button" aria-selected="false" aria-controls="panel-settings" tabindex="-1">
        <span data-i18n="uiTabSettings">Settings</span>
      </button>
    </div>
  </header>

  <main class="sp-main">
    <div id="sp-error" class="sp-error" role="alert" hidden></div>

    <section class="sp-panel" id="panel-multiply" role="tabpanel" aria-labelledby="tab-multiply">
      <div class="sp-section">
        <h2 class="sp-section__head" id="sp-multhead" data-i18n="uiMultiplier">Multiplier</h2>
        <div class="sp-chips" id="sp-mults" role="group" aria-labelledby="sp-multhead"></div>
      </div>

      <div class="sp-section">
        <h2 class="sp-section__head" data-i18n="uiPreview">Preview</h2>
        <p class="sp-sample" id="sp-preview"></p>
      </div>

      <div class="sp-actions">
        <button class="sp-btn sp-btn--wide" id="sp-apply" type="button">
          <span class="sp-btn__labels">
            <span class="sp-btn__label" data-i18n="uiApply">Apply</span>
            <span class="sp-btn__label sp-btn__label--done" aria-hidden="true" data-i18n="uiApplied">Applied</span>
          </span>
        </button>
        <button class="sp-btn sp-btn--ghost" id="sp-reset" type="button">
          <span class="sp-btn__labels">
            <span class="sp-btn__label" data-i18n="uiReset">Reset</span>
            <span class="sp-btn__label sp-btn__label--done" aria-hidden="true" data-i18n="uiResetDone">Restored</span>
          </span>
        </button>
      </div>

      <label class="sp-switch">
        <input type="checkbox" id="sp-remember">
        <span data-i18n="uiRemember">Keep it after a refresh</span>
      </label>
      <p class="sp-note sp-note--switch">
        <span data-i18n="uiRememberShort">Asks permission.</span>
        <button class="sp-help" type="button" popovertarget="sp-remember-help" data-i18n-label="uiWhy">?</button>
      </p>

      <div id="sp-remember-help" class="sp-popover" popover role="dialog" aria-labelledby="sp-remember-help-head">
        <h3 class="sp-section__head" id="sp-remember-help-head" data-i18n="uiRemember">Keep it after a refresh</h3>
        <p class="sp-popover__body" data-i18n="uiRememberNote"></p>
        <button class="sp-btn sp-btn--ghost sp-btn--compact sp-popover__close" type="button" autofocus
                popovertarget="sp-remember-help" popovertargetaction="hide" data-i18n="uiClose">Close</button>
      </div>

      <p class="sp-sr" id="sp-status" role="status"></p>
    </section>

    <section class="sp-panel" id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden></section>
  </main>

  <footer class="sp-foot">
    <span class="sp-foot__name">
      <img class="sp-foot__logo" src="icons/icon16.png" alt="" width="16" height="16">
      <span data-i18n="appShortName">Spill</span>
    </span>
    <a class="sp-foot__link" id="sp-author" target="_blank" rel="noreferrer">Robin Poort</a>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
